<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Schematic Assistant</title>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --border-color: #3e3e42;
            --accent-blue: #007acc;
            --accent-blue-hover: #0098ff;
            --user-msg-bg: #005a9e;
            --ai-msg-bg: #2d2d30;
            --error-color: #f48771;
            --success-color: #89d185;
            --warning-color: #cca700;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
        }

        #sidebar.collapsed {
            margin-left: -280px;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-blue-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #3e3e42;
        }

        /* Main Chat Area */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
        }

        .toggle-sidebar:hover {
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status-dot.ready {
            background: var(--success-color);
        }

        .status-dot.thinking {
            background: var(--warning-color);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--user-msg-bg);
        }

        .message.ai .message-avatar {
            background: var(--accent-blue);
        }

        .message-content {
            background: var(--ai-msg-bg);
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        /* Clickable references */
        .ref-tag {
            display: inline-block;
            background: rgba(0, 122, 204, 0.2);
            color: var(--accent-blue);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(0, 122, 204, 0.3);
            transition: all 0.2s;
        }

        .ref-tag:hover {
            background: rgba(0, 122, 204, 0.3);
            border-color: var(--accent-blue);
        }

        /* Attached images */
        .message-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Input Area */
        #input-area {
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            padding: 16px 20px;
        }

        .file-previews {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .file-preview {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .file-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        #message-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .input-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        #attach-btn {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        #attach-btn:hover {
            background: #3e3e42;
            color: var(--text-primary);
        }

        #send-btn {
            background: var(--accent-blue);
            color: white;
        }

        #send-btn:hover:not(:disabled) {
            background: var(--accent-blue-hover);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Config Modal */
        #config-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #config-modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
        }

        .empty-state-hint {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">原理图助手</div>
        </div>
        <div class="sidebar-content">
            <div class="info-section">
                <div class="info-label">原理图摘要</div>
                <div class="info-value" id="info-components">器件: 加载中...</div>
                <div class="info-value" id="info-pins">引脚: 加载中...</div>
                <div class="info-value" id="info-nets">网络: 加载中...</div>
            </div>
            <div class="info-section">
                <button class="btn" id="btn-config">⚙️ 配置 AI</button>
            </div>
            <div class="info-section">
                <button class="btn btn-secondary" id="btn-new-chat">🔄 新建对话</button>
            </div>
        </div>
    </div>

    <!-- Main Chat -->
    <div id="main">
        <div class="chat-header">
            <button class="toggle-sidebar" id="toggle-sidebar">☰</button>
            <div class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">准备就绪</span>
            </div>
        </div>

        <div id="messages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">开始与AI对话</div>
                <div class="empty-state-hint">询问原理图问题、请求审查建议或上传截图</div>
            </div>
        </div>

        <div id="input-area">
            <div class="file-previews" id="file-previews"></div>
            <div class="input-wrapper">
                <button class="input-btn" id="attach-btn" title="上传图片">📎</button>
                <textarea id="message-input" placeholder="输入消息... (Shift+Enter换行)" rows="1"></textarea>
                <button class="input-btn" id="send-btn" title="发送">➤</button>
            </div>
            <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
        </div>
    </div>

    <!-- Config Modal -->
    <div id="config-modal">
        <div class="modal-content">
            <div class="modal-header">AI 配置</div>
            <div class="form-group">
                <label class="form-label">AI Provider</label>
                <select class="form-control" id="cfg-provider">
                    <option value="openai">OpenAI</option>
                    <option value="claude">Anthropic Claude</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" class="form-control" id="cfg-apikey" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label class="form-label">Model</label>
                <input type="text" class="form-control" id="cfg-model" value="gpt-4o">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancel-config">取消</button>
                <button class="btn" id="btn-save-config">保存</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let messages = [];
        let attachedFiles = [];
        let schematicData = null;
        let isThinking = false;

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const filePreviews = document.getElementById('file-previews');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const configModal = document.getElementById('config-modal');

        // Initialize
        init();

        function init() {
            setupEventListeners();
            loadSchematicData();
            setStatus('ready', '准备就绪');
        }

        function setupEventListeners() {
            // Sidebar toggle
            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });

            // Config modal
            document.getElementById('btn-config').addEventListener('click', openConfigModal);
            document.getElementById('btn-cancel-config').addEventListener('click', closeConfigModal);
            document.getElementById('btn-save-config').addEventListener('click', saveConfig);

            // New chat
            document.getElementById('btn-new-chat').addEventListener('click', newChat);

            // File attach
            attachBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);

            // Send message
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Auto-resize textarea
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = messageInput.scrollHeight + 'px';
            });

            // MessageBus listeners
            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.subscribePublic('ai-chat/schematic-data', handleSchematicData);
                eda.sys_MessageBus.subscribePublic('ai-chat/ai-response', handleAIResponse);
                eda.sys_MessageBus.subscribePublic('ai-chat/error', handleError);
            }
        }

        // Schematic Data
        function loadSchematicData() {
            publishMessage('ai-chat/request-data', {});
        }

        function handleSchematicData(data) {
            if (!data || !data.summary) return;
            schematicData = data;
            document.getElementById('info-components').textContent = `器件: ${data.summary.components}`;
            document.getElementById('info-pins').textContent = `引脚: ${data.summary.pins}`;
            document.getElementById('info-nets').textContent = `网络: ${data.summary.nets}`;
        }

        // File Handling
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        attachedFiles.push({
                            name: file.name,
                            type: file.type,
                            data: event.target.result
                        });
                        renderFilePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });
            fileInput.value = '';
        }

        function renderFilePreviews() {
            filePreviews.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const preview = document.createElement('div');
                preview.className = 'file-preview';
                preview.innerHTML = `
                    <img src="${file.data}" alt="${file.name}">
                    <button class="file-preview-remove" data-index="${index}">×</button>
                `;
                preview.querySelector('.file-preview-remove').addEventListener('click', () => {
                    attachedFiles.splice(index, 1);
                    renderFilePreviews();
                });
                filePreviews.appendChild(preview);
            });
        }

        // Messaging
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && attachedFiles.length === 0) return;
            if (isThinking) return;

            // Add user message
            const userMsg = {
                role: 'user',
                content: text,
                images: [...attachedFiles],
                timestamp: Date.now()
            };
            messages.push(userMsg);
            renderMessages();

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            attachedFiles = [];
            renderFilePreviews();

            // Send to backend
            setStatus('thinking', 'AI 正在思考...');
            isThinking = true;
            publishMessage('ai-chat/user-message', {
                text,
                images: userMsg.images,
                schematicData
            });
        }

        function handleAIResponse(data) {
            isThinking = false;
            setStatus('ready', '准备就绪');

            if (!data || !data.content) return;

            const aiMsg = {
                role: 'ai',
                content: data.content,
                timestamp: Date.now()
            };
            messages.push(aiMsg);
            renderMessages();
        }

        function handleError(data) {
            isThinking = false;
            setStatus('ready', '准备就绪');

            const errorMsg = {
                role: 'ai',
                content: `❌ 错误: ${data.message || '未知错误'}`,
                timestamp: Date.now()
            };
            messages.push(errorMsg);
            renderMessages();
        }

        function renderMessages() {
            // Remove empty state
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            // Clear and re-render
            messagesContainer.innerHTML = '';
            messages.forEach(msg => {
                const msgEl = createMessageElement(msg);
                messagesContainer.appendChild(msgEl);
            });

            // Add typing indicator if thinking
            if (isThinking) {
                const typingEl = document.createElement('div');
                typingEl.className = 'message ai';
                typingEl.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                messagesContainer.appendChild(typingEl);
            }

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function createMessageElement(msg) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${msg.role}`;

            const avatar = msg.role === 'user' ? '👤' : '🤖';
            let contentHTML = escapeHtml(msg.content);

            // Parse markdown-like syntax
            contentHTML = parseMarkdown(contentHTML);

            // Highlight references (U1, C5, VCC_3V3, etc.)
            contentHTML = highlightReferences(contentHTML);

            // Add images if any
            let imagesHTML = '';
            if (msg.images && msg.images.length > 0) {
                imagesHTML = '<div class="message-images">' +
                    msg.images.map(img => `<img src="${img.data}" class="message-image" alt="${img.name}">`).join('') +
                    '</div>';
            }

            msgEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    ${contentHTML}
                    ${imagesHTML}
                </div>
            `;

            // Attach click handlers to references
            msgEl.querySelectorAll('.ref-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const ref = tag.dataset.ref;
                    locateReference(ref);
                });
            });

            return msgEl;
        }

        function parseMarkdown(text) {
            // Code blocks
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function highlightReferences(text) {
            // Match component designators (U1, C5, R10, etc.)
            text = text.replace(/\b([URCLDQJK]\d+)\b/g, '<span class="ref-tag" data-ref="$1" data-type="component">$1</span>');
            // Match net names (VCC_3V3, GND, NET_*, etc.)
            text = text.replace(/\b(VCC[_\w]*|GND|NET_[\w]+|V\d+V\d*)\b/g, '<span class="ref-tag" data-ref="$1" data-type="net">$1</span>');
            return text;
        }

        function locateReference(ref) {
            publishMessage('ai-chat/locate', { reference: ref });
        }

        // Config
        function openConfigModal() {
            configModal.classList.add('active');
            // Load current config
            const config = loadConfig();
            document.getElementById('cfg-provider').value = config.provider || 'openai';
            document.getElementById('cfg-apikey').value = config.apiKey || '';
            document.getElementById('cfg-model').value = config.model || 'gpt-4o';
        }

        function closeConfigModal() {
            configModal.classList.remove('active');
        }

        function saveConfig() {
            const config = {
                provider: document.getElementById('cfg-provider').value,
                apiKey: document.getElementById('cfg-apikey').value,
                model: document.getElementById('cfg-model').value
            };
            localStorage.setItem('ai-chat-config', JSON.stringify(config));
            publishMessage('ai-chat/config-update', config);
            closeConfigModal();
        }

        function loadConfig() {
            try {
                const stored = localStorage.getItem('ai-chat-config');
                return stored ? JSON.parse(stored) : {};
            } catch {
                return {};
            }
        }

        // Utilities
        function newChat() {
            messages = [];
            renderMessages();
            messagesContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">开始与AI对话</div>
                    <div class="empty-state-hint">询问原理图问题、请求审查建议或上传截图</div>
                </div>
            `;
        }

        function setStatus(type, text) {
            statusDot.className = `status-dot ${type}`;
            statusText.textContent = text;
        }

        function publishMessage(topic, data) {
            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.publishPublic(topic, data);
            } else {
                console.log('[Mock Send]', topic, data);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
