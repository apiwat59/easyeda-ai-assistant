<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 原理图助手</title>
    <style>
        :root {
            --bg-app: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-input: #f5f5f5;
            --bg-hover: #e8eaed;
            --bg-active: #d3d7dc;
            --border-color: #dcdfe6;
            --accent-color: #1976d2;
            --accent-hover: #1565c0;
            --accent-light: #e3f2fd;
            --text-primary: #303133;
            --text-secondary: #909399;
            --text-placeholder: #c0c4cc;
            --msg-user-bg: #e3f2fd;
            --msg-user-text: #1a237e;
            --msg-ai-bg: #f5f5f5;
            --success-color: #67c23a;
            --warning-color: #e6a23c;
            --error-color: #f56c6c;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --radius-sm: 2px;
            --radius-md: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-app);
            height: 100vh;
            display: flex;
            overflow: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #909399; }

        #sidebar {
            width: 220px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: margin-left 0.2s;
        }
        #sidebar.collapsed { margin-left: -220px; }

        .sidebar-header {
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-title { font-size: 14px; font-weight: 600; }

        .sidebar-content { flex: 1; padding: 10px; overflow-y: auto; }

        .info-section { margin-bottom: 12px; }
        .info-label {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .info-value {
            background: var(--bg-input);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-family: Consolas, monospace;
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 3px;
        }

        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 12px;
            color: #fff;
            background: var(--accent-color);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            height: 30px;
            font-family: inherit;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--bg-panel);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: var(--bg-hover); }

        .history-section {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .history-label {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            padding: 6px 8px;
            margin-bottom: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-primary);
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item:hover {
            background: var(--bg-hover);
            border-color: var(--accent-color);
        }
        .history-item.active {
            background: var(--accent-light);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .history-empty {
            color: var(--text-placeholder);
            font-size: 11px;
            text-align: center;
            padding: 10px;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-app);
            min-width: 0;
        }

        .chat-header {
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }
        .toggle-sidebar {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }
        .toggle-sidebar:hover { background: var(--bg-hover); color: var(--text-primary); }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
        }
        .status-dot.ready { background: var(--success-color); }
        .status-dot.thinking { background: var(--warning-color); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }

        .message-avatar {
            width: 26px; height: 26px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
        .message.user .message-avatar { background: var(--accent-light); color: var(--accent-color); }
        .message.ai .message-avatar { background: var(--accent-color); color: #fff; }

        .message-content {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: var(--msg-user-bg);
            color: var(--msg-user-text);
            border-top-right-radius: 0;
        }
        .message.ai .message-content {
            background: var(--msg-ai-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 0;
        }

        .message-content p { margin-bottom: 6px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content code {
            background: rgba(0,0,0,0.06);
            padding: 1px 4px;
            border-radius: 2px;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            color: #c7254e;
        }
        .message-content pre {
            background: #f8f8f8;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 6px 0;
        }
        .message-content pre code { background: none; padding: 0; color: inherit; }

        .ref-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent-color);
            padding: 0 5px;
            border-radius: 2px;
            font-family: Consolas, monospace;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(25,118,210,0.3);
            transition: background 0.15s;
        }
        .ref-tag:hover { background: #bbdefb; }

        .message-images { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .message-image {
            max-width: 180px; max-height: 180px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .typing-indicator { display: flex; gap: 4px; padding: 8px 12px; }
        .typing-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

        #input-area {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
        }
        .file-previews { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .file-preview {
            position: relative;
            width: 48px; height: 48px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .file-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-preview-remove {
            position: absolute; top: 1px; right: 1px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff; border: none;
            cursor: pointer; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        .input-wrapper { display: flex; gap: 6px; align-items: flex-end; }
        #message-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 7px 10px;
            font-family: var(--font-family);
            font-size: 13px;
            resize: none;
            min-height: 34px;
            max-height: 100px;
            outline: none;
            line-height: 1.5;
        }
        #message-input:focus { border-color: var(--accent-color); }
        #message-input::placeholder { color: var(--text-placeholder); }

        .input-btn {
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            transition: all 0.15s;
        }
        .input-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        #send-btn { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #config-modal {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #config-modal.active { display: flex; }
        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            width: 400px; max-width: 90%;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 16px;
        }
        .modal-header {
            font-size: 15px; font-weight: 600;
            margin-bottom: 14px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; margin-bottom: 4px; color: var(--text-secondary); font-size: 12px; }
        .form-control {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent-color); }
        .form-hint { font-size: 11px; color: var(--text-placeholder); margin-top: 3px; }
        .modal-actions {
            display: flex; gap: 8px;
            justify-content: flex-end;
            margin-top: 14px; padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .modal-actions .btn { width: auto; padding: 6px 20px; }

        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-secondary); gap: 8px;
        }
        .empty-state-icon { font-size: 40px; opacity: 0.3; }
        .empty-state-text { font-size: 15px; color: var(--text-primary); }
        .empty-state-hint { font-size: 12px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">原理图助手</div>
        </div>
        <div class="sidebar-content">
            <div class="info-section">
                <div class="info-label">原理图数据</div>
                <div class="info-value" id="info-components">器件: 采集中...</div>
                <div class="info-value" id="info-pins">引脚: 采集中...</div>
                <div class="info-value" id="info-nets">网络: 采集中...</div>
            </div>
            <div class="info-section">
                <button class="btn" id="btn-config">配置 AI</button>
            </div>
            <div class="info-section">
                <button class="btn btn-secondary" id="btn-new-chat">新建对话</button>
            </div>
            <div class="history-section">
                <div class="info-label">历史会话</div>
                <div class="history-list" id="history-list">
                    <div class="history-empty">暂无历史记录</div>
                </div>
            </div>
        </div>
    </div>

    <div id="main">
        <div class="chat-header">
            <button class="toggle-sidebar" id="toggle-sidebar">&#9776;</button>
            <div class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">就绪</span>
            </div>
        </div>

        <div id="messages">
            <div class="empty-state">
                <div class="empty-state-icon">&#128172;</div>
                <div class="empty-state-text">AI 原理图助手</div>
                <div class="empty-state-hint">询问原理图问题、请求审查建议或上传截图</div>
            </div>
        </div>

        <div id="input-area">
            <div class="file-previews" id="file-previews"></div>
            <div class="input-wrapper">
                <button class="input-btn" id="attach-btn" title="上传图片">&#128206;</button>
                <textarea id="message-input" placeholder="输入消息... (Shift+Enter换行)" rows="1"></textarea>
                <button class="input-btn" id="send-btn" title="发送">&#10148;</button>
            </div>
            <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
        </div>
    </div>

    <div id="config-modal">
        <div class="modal-content">
            <div class="modal-header">AI 配置</div>
            <div class="form-group">
                <label class="form-label">API 地址</label>
                <input type="text" class="form-control" id="cfg-apiurl" placeholder="https://api.openai.com/v1/chat/completions">
                <div class="form-hint">OpenAI 兼容的 Chat Completions 接口地址</div>
            </div>
            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" class="form-control" id="cfg-apikey" placeholder="输入你的 API Key">
            </div>
            <div class="form-group">
                <label class="form-label">模型名称</label>
                <input type="text" class="form-control" id="cfg-model" value="gpt-4o">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancel-config">取消</button>
                <button class="btn" id="btn-save-config">保存</button>
            </div>
        </div>
    </div>

    <script>
        var messages = [];
        var attachedFiles = [];
        var schematicData = null;
        var isThinking = false;
        var currentConfig = {};
        var historySessions = []; // 历史会话列表
        var currentSessionId = null; // 当前会话ID

        var sidebar = document.getElementById('sidebar');
        var messagesContainer = document.getElementById('messages');
        var messageInput = document.getElementById('message-input');
        var sendBtn = document.getElementById('send-btn');
        var attachBtn = document.getElementById('attach-btn');
        var fileInput = document.getElementById('file-input');
        var filePreviews = document.getElementById('file-previews');
        var statusDot = document.getElementById('status-dot');
        var statusText = document.getElementById('status-text');
        var configModal = document.getElementById('config-modal');
        var historyList = document.getElementById('history-list');

        init();

        function init() {
            setupEventListeners();
            setStatus('ready', '就绪');
            // 向主扩展请求数据、配置和历史记录
            publishMessage('ai-chat/request-data', {});
            publishMessage('ai-chat/request-config', {});
            publishMessage('ai-chat/request-history', {});
        }

        function saveHistory() {
            if (messages.length === 0) return;

            // 更新当前会话到历史会话列表
            var lightweight = messages.map(function(msg) {
                var copy = { role: msg.role, content: msg.content, timestamp: msg.timestamp };
                if (msg.images && msg.images.length > 0) {
                    copy.imageCount = msg.images.length;
                }
                return copy;
            });

            if (!currentSessionId) {
                currentSessionId = 'session_' + Date.now();
            }

            // 查找并更新当前会话
            var found = false;
            for (var i = 0; i < historySessions.length; i++) {
                if (historySessions[i].id === currentSessionId) {
                    historySessions[i].messages = lightweight;
                    historySessions[i].title = getSessionTitle(lightweight);
                    historySessions[i].updatedAt = Date.now();
                    found = true;
                    break;
                }
            }
            if (!found) {
                historySessions.unshift({
                    id: currentSessionId,
                    title: getSessionTitle(lightweight),
                    messages: lightweight,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });
            }

            // 最多保留20个会话
            if (historySessions.length > 20) {
                historySessions = historySessions.slice(0, 20);
            }

            publishMessage('ai-chat/history-update', { messages: historySessions });
            renderHistoryList();
        }

        function getSessionTitle(msgs) {
            for (var i = 0; i < msgs.length; i++) {
                if (msgs[i].role === 'user' && msgs[i].content) {
                    var title = msgs[i].content.substring(0, 30);
                    if (msgs[i].content.length > 30) title += '...';
                    return title;
                }
            }
            return '新对话';
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            if (historySessions.length === 0) {
                historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                return;
            }
            historySessions.forEach(function(session) {
                var item = document.createElement('div');
                item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');
                item.textContent = session.title || '新对话';
                item.title = session.title || '新对话';
                item.addEventListener('click', function() {
                    loadSession(session.id);
                });
                historyList.appendChild(item);
            });
        }

        function loadSession(sessionId) {
            for (var i = 0; i < historySessions.length; i++) {
                if (historySessions[i].id === sessionId) {
                    currentSessionId = sessionId;
                    messages = historySessions[i].messages.slice();
                    renderMessages();
                    renderHistoryList();
                    // 通知后端清空会话，因为后端不存储历史
                    publishMessage('ai-chat/clear-session', {});
                    return;
                }
            }
        }

        function setupEventListeners() {
            document.getElementById('toggle-sidebar').addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
            });
            document.getElementById('btn-config').addEventListener('click', openConfigModal);
            document.getElementById('btn-cancel-config').addEventListener('click', closeConfigModal);
            document.getElementById('btn-save-config').addEventListener('click', saveConfig);
            document.getElementById('btn-new-chat').addEventListener('click', newChat);
            attachBtn.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', handleFileSelect);
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            messageInput.addEventListener('input', function() {
                messageInput.style.height = 'auto';
                messageInput.style.height = messageInput.scrollHeight + 'px';
            });

            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.subscribePublic('ai-chat/schematic-data', handleSchematicData);
                eda.sys_MessageBus.subscribePublic('ai-chat/config-data', handleConfigData);
                eda.sys_MessageBus.subscribePublic('ai-chat/history-data', handleHistoryData);
                eda.sys_MessageBus.subscribePublic('ai-chat/ai-response', handleAIResponse);
                eda.sys_MessageBus.subscribePublic('ai-chat/error', handleError);
            }
        }

        function handleSchematicData(data) {
            if (!data || !data.summary) return;
            schematicData = data;
            // -1 表示正在采集中
            var c = data.summary.components;
            var p = data.summary.pins;
            var n = data.summary.nets;
            document.getElementById('info-components').textContent = '器件: ' + (c < 0 ? '采集中...' : c);
            document.getElementById('info-pins').textContent = '引脚: ' + (p < 0 ? '采集中...' : p);
            document.getElementById('info-nets').textContent = '网络: ' + (n < 0 ? '采集中...' : n);
        }

        function handleConfigData(data) {
            if (!data) return;
            currentConfig = data;
            // 如果配置弹窗正在打开，立即回填
            if (configModal.classList.contains('active')) {
                document.getElementById('cfg-apiurl').value = data.apiUrl || 'https://api.openai.com/v1/chat/completions';
                document.getElementById('cfg-apikey').value = data.apiKey || '';
                document.getElementById('cfg-model').value = data.model || 'gpt-4o';
            }
        }

        function handleHistoryData(data) {
            if (!data || !Array.isArray(data.messages)) return;
            // 历史数据现在是会话列表
            historySessions = data.messages;
            renderHistoryList();
            // 如果当前无消息且有历史会话，加载最新的会话
            if (messages.length === 0 && historySessions.length > 0) {
                loadSession(historySessions[0].id);
            }
        }

        function handleFileSelect(e) {
            var files = Array.from(e.target.files);
            files.forEach(function(file) {
                if (file.type.startsWith('image/')) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        attachedFiles.push({ name: file.name, type: file.type, data: event.target.result });
                        renderFilePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });
            fileInput.value = '';
        }

        function renderFilePreviews() {
            filePreviews.innerHTML = '';
            attachedFiles.forEach(function(file, index) {
                var preview = document.createElement('div');
                preview.className = 'file-preview';
                preview.innerHTML =
                    '<img src="' + file.data + '" alt="' + file.name + '">' +
                    '<button class="file-preview-remove" data-index="' + index + '">&times;</button>';
                preview.querySelector('.file-preview-remove').addEventListener('click', function() {
                    attachedFiles.splice(index, 1);
                    renderFilePreviews();
                });
                filePreviews.appendChild(preview);
            });
        }

        function sendMessage() {
            var text = messageInput.value.trim();
            if (!text && attachedFiles.length === 0) return;
            if (isThinking) return;

            var userMsg = { role: 'user', content: text, images: attachedFiles.slice(), timestamp: Date.now() };
            messages.push(userMsg);
            saveHistory();
            renderMessages();

            messageInput.value = '';
            messageInput.style.height = 'auto';
            attachedFiles = [];
            renderFilePreviews();

            setStatus('thinking', 'AI 正在思考...');
            isThinking = true;
            publishMessage('ai-chat/user-message', { text: text, images: userMsg.images, schematicData: schematicData });
        }

        function handleAIResponse(data) {
            isThinking = false;
            setStatus('ready', '就绪');
            if (!data || !data.content) return;
            messages.push({ role: 'ai', content: data.content, timestamp: Date.now() });
            saveHistory();
            renderMessages();
        }

        function handleError(data) {
            if (!isThinking) return; // 防止重复处理
            isThinking = false;
            setStatus('ready', '就绪');
            messages.push({ role: 'ai', content: '错误: ' + (data.message || '未知错误'), timestamp: Date.now() });
            saveHistory();
            renderMessages();
        }

        function renderMessages() {
            var emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            messagesContainer.innerHTML = '';
            messages.forEach(function(msg) {
                messagesContainer.appendChild(createMessageElement(msg));
            });

            if (isThinking) {
                var el = document.createElement('div');
                el.className = 'message ai';
                el.innerHTML =
                    '<div class="message-avatar">AI</div>' +
                    '<div class="message-content typing-indicator">' +
                    '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
                messagesContainer.appendChild(el);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function createMessageElement(msg) {
            var el = document.createElement('div');
            el.className = 'message ' + msg.role;
            var avatar = msg.role === 'user' ? 'U' : 'AI';
            var html = escapeHtml(msg.content);
            html = parseMarkdown(html);
            html = highlightReferences(html);

            var imgHtml = '';
            if (msg.images && msg.images.length > 0) {
                imgHtml = '<div class="message-images">' +
                    msg.images.map(function(img) { return '<img src="' + img.data + '" class="message-image" alt="' + img.name + '">'; }).join('') +
                    '</div>';
            } else if (msg.imageCount && msg.imageCount > 0) {
                // 历史记录中的图片已被移除，显示占位符
                imgHtml = '<div class="message-images" style="color: var(--text-secondary); font-style: italic;">[' + msg.imageCount + ' 张图片]</div>';
            }

            el.innerHTML =
                '<div class="message-avatar">' + avatar + '</div>' +
                '<div class="message-content">' + html + imgHtml + '</div>';

            el.querySelectorAll('.ref-tag').forEach(function(tag) {
                tag.addEventListener('click', function() { locateReference(tag.dataset.ref); });
            });
            return el;
        }

        function parseMarkdown(t) {
            t = t.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/\n/g, '<br>');
            return t;
        }

        function highlightReferences(t) {
            t = t.replace(/\b([URCLDQJK]\d+)\b/g, '<span class="ref-tag" data-ref="$1" data-type="component">$1</span>');
            t = t.replace(/\b(VCC[_\w]*|GND|NET_[\w]+|V\d+V\d*)\b/g, '<span class="ref-tag" data-ref="$1" data-type="net">$1</span>');
            return t;
        }

        function locateReference(ref) { publishMessage('ai-chat/locate', { reference: ref }); }

        function openConfigModal() {
            configModal.classList.add('active');
            // 向主扩展请求最新配置
            publishMessage('ai-chat/request-config', {});
            // 填入当前缓存的配置
            document.getElementById('cfg-apiurl').value = currentConfig.apiUrl || 'https://api.openai.com/v1/chat/completions';
            document.getElementById('cfg-apikey').value = currentConfig.apiKey || '';
            document.getElementById('cfg-model').value = currentConfig.model || 'gpt-4o';
        }

        function closeConfigModal() { configModal.classList.remove('active'); }

        function saveConfig() {
            var config = {
                provider: 'openai_compatible',
                apiUrl: document.getElementById('cfg-apiurl').value,
                apiKey: document.getElementById('cfg-apikey').value,
                model: document.getElementById('cfg-model').value
            };
            // 通过MessageBus发送给主扩展保存，不使用IFrame的localStorage
            publishMessage('ai-chat/config-update', config);
            currentConfig = config;
            closeConfigModal();
        }

        function newChat() {
            // 如果当前有消息，先保存
            if (messages.length > 0) {
                saveHistory();
            }
            // 创建新会话
            currentSessionId = null;
            messages = [];
            isThinking = false;
            setStatus('ready', '就绪');
            // 通知后端清空对话会话
            publishMessage('ai-chat/clear-session', {});
            messagesContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="empty-state-icon">&#128172;</div>' +
                '<div class="empty-state-text">AI 原理图助手</div>' +
                '<div class="empty-state-hint">询问原理图问题、请求审查建议或上传截图</div></div>';
            renderHistoryList();
        }

        function setStatus(type, text) {
            statusDot.className = 'status-dot ' + type;
            statusText.textContent = text;
        }

        function publishMessage(topic, data) {
            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.publishPublic(topic, data);
            } else {
                console.log('[Mock]', topic, data);
            }
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
    </script>
</body>
</html>
