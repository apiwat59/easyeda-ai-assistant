<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Schematic Review</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --border-color: #3e3e42;
            --accent-color: #007acc;
            --accent-hover: #0098ff;
            --error-color: #f14c4c;
            --warning-color: #cca700;
            --success-color: #89d185;
            --input-bg: #3c3c3c;
            --font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header & Config */
        header {
            padding: 10px 15px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 { margin: 0; font-size: 16px; font-weight: 600; }

        .config-toggle {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 12px;
        }

        #config-panel {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px;
            display: none;
        }

        #config-panel.active { display: block; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-secondary); }
        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-sm { padding: 4px 8px; font-size: 11px; }

        /* Status Bar */
        #status-bar {
            padding: 5px 15px;
            background-color: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #555; display: inline-block; }
        .status-dot.active { background-color: var(--success-color); }
        .status-dot.processing { background-color: var(--warning-color); animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            padding: 8px 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
        }
        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-color);
            background-color: var(--bg-color);
        }
        .badge {
            background-color: #444;
            padding: 1px 5px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 5px;
        }
        .tab.active .badge { background-color: var(--accent-color); color: white; }

        /* Content Area */
        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .review-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
            border-left: 4px solid transparent;
        }

        .review-card.must-fix { border-left-color: var(--error-color); }
        .review-card.suggestion { border-left-color: var(--warning-color); }

        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-title { font-weight: 600; font-size: 14px; }
        .must-fix .card-title { color: var(--error-color); }
        .suggestion .card-title { color: var(--warning-color); }

        .confidence-wrapper { display: flex; align-items: center; font-size: 11px; color: var(--text-secondary); gap: 5px; }
        .progress-bg { width: 60px; height: 4px; background: #444; border-radius: 2px; }
        .progress-fill { height: 100%; background: var(--success-color); border-radius: 2px; }

        .card-section { margin-bottom: 6px; }
        .section-label { font-weight: 600; color: var(--text-secondary); font-size: 11px; display: inline-block; width: 60px; }
        .section-content { color: var(--text-primary); }

        .evidence-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .tag {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            border: 1px solid #444;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 5px; border: 2px solid var(--bg-color); }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
    </style>
</head>
<body>

    <header>
        <h2>AI Schematic Review</h2>
        <button class="config-toggle" id="btn-toggle-config">⚙ 配置</button>
    </header>

    <div id="config-panel">
        <div class="form-group">
            <label>AI Provider</label>
            <select class="form-control" id="cfg-provider">
                <option value="openai">OpenAI</option>
                <option value="claude">Anthropic Claude</option>
            </select>
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input type="password" class="form-control" id="cfg-apikey" placeholder="sk-...">
        </div>
        <div class="form-group">
            <label>Model</label>
            <input type="text" class="form-control" id="cfg-model" value="gpt-4o">
        </div>
        <div style="text-align: right;">
            <button class="btn" id="btn-save-config">保存配置</button>
        </div>
    </div>

    <div id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Ready</span>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="must_fix">
            Must Fix <span class="badge" id="badge-must-fix">0</span>
        </div>
        <div class="tab" data-tab="suggestions">
            Suggestions <span class="badge" id="badge-suggestions">0</span>
        </div>
    </div>

    <div id="content-area">
        <div style="text-align: center; color: var(--text-secondary); padding-top: 40px;">
            等待审查结果...
        </div>
    </div>

    <script>
        // State
        let currentTab = 'must_fix';
        let reviewData = {
            must_fix: [],
            suggestions: []
        };

        // DOM Elements
        const contentArea = document.getElementById('content-area');
        const tabs = document.querySelectorAll('.tab');
        const configPanel = document.getElementById('config-panel');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        // Event Listeners
        document.getElementById('btn-toggle-config').addEventListener('click', () => {
            configPanel.classList.toggle('active');
        });

        document.getElementById('btn-save-config').addEventListener('click', () => {
            const config = {
                provider: document.getElementById('cfg-provider').value,
                apiKey: document.getElementById('cfg-apikey').value,
                model: document.getElementById('cfg-model').value
            };
            safePublish('ai-review/config-update', config);
            configPanel.classList.remove('active');
            showStatus('Configuration saved', 'active');
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                render();
            });
        });

        // Render Logic
        function render() {
            contentArea.innerHTML = '';
            const items = reviewData[currentTab] || [];

            if (items.length === 0) {
                contentArea.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding-top: 40px;">无相关条目</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `review-card ${currentTab === 'must_fix' ? 'must-fix' : 'suggestion'}`;

                // P2: 防止confidence非数字导致NaN%
                const confidencePercent = Math.max(0, Math.min(100, Math.round((Number(item.confidence) || 0) * 100)));

                let evidenceHtml = '';
                if (item.evidence) {
                    if (item.evidence.components?.length) evidenceHtml += item.evidence.components.map(c => `<span class="tag">Ref:${escapeHtml(c)}</span>`).join('');
                    if (item.evidence.nets?.length) evidenceHtml += item.evidence.nets.map(n => `<span class="tag">Net:${escapeHtml(n)}</span>`).join('');
                    if (item.evidence.pins?.length) evidenceHtml += item.evidence.pins.map(p => `<span class="tag">Pin:${escapeHtml(p)}</span>`).join('');
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${escapeHtml(item.title)}</span>
                        <div class="confidence-wrapper">
                            <span>置信度: ${confidencePercent}%</span>
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${confidencePercent}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-section">
                        <span class="section-label">原因:</span>
                        <span class="section-content">${escapeHtml(item.reason)}</span>
                    </div>
                    <div class="card-section">
                        <span class="section-label">影响:</span>
                        <span class="section-content">${escapeHtml(item.impact)}</span>
                    </div>
                    <div class="card-section">
                        <span class="section-label">建议:</span>
                        <span class="section-content">${escapeHtml(item.fix)}</span>
                    </div>
                    ${evidenceHtml ? `<div class="evidence-tags">${evidenceHtml}</div>` : ''}
                    <div class="actions">
                        ${item.evidence?.datasheet_urls?.length ? `<button class="btn btn-sm" data-action="datasheet" data-url="${escapeHtml(item.evidence.datasheet_urls[0])}">Datasheet</button>` : ''}
                        <button class="btn btn-sm" data-action="locate" data-evidence='${escapeHtml(JSON.stringify(item.evidence))}'>🔍 定位</button>
                    </div>
                `;
                contentArea.appendChild(card);

                // Attach event listeners to buttons
                card.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const action = this.getAttribute('data-action');
                        if (action === 'datasheet') {
                            const url = this.getAttribute('data-url');
                            openDatasheet(url);
                        } else if (action === 'locate') {
                            const evidenceJson = this.getAttribute('data-evidence');
                            try {
                                const evidence = JSON.parse(evidenceJson);
                                locateItem(evidence);
                            } catch (e) {
                                console.error('Failed to parse evidence:', e);
                            }
                        }
                    });
                });
            });
        }

        function updateBadges() {
            document.getElementById('badge-must-fix').textContent = reviewData.must_fix.length;
            document.getElementById('badge-suggestions').textContent = reviewData.suggestions.length;
        }

        // Actions
        function locateItem(evidence) {
            if (!evidence) return;
            safePublish('ai-review/locate', {
                components: evidence.components || [],
                nets: evidence.nets || [],
                pins: evidence.pins || []
            });
        }

        function openDatasheet(url) {
            if (!url) return;
            // P0: 验证URL协议，防止XSS
            try {
                const parsed = new URL(url);
                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                    console.warn('Blocked non-HTTP URL:', url);
                    return;
                }
            } catch (e) {
                console.warn('Invalid URL:', url);
                return;
            }
            safePublish('ai-review/open-url', { url });
        }

        // Communication Helpers
        function safePublish(topic, data) {
            if (typeof eda !== 'undefined' && eda.sys_MessageBus && eda.sys_MessageBus.publishPublic) {
                eda.sys_MessageBus.publishPublic(topic, data);
            } else {
                console.log('[Mock Send]', topic, data);
            }
        }

        function showStatus(text, type = 'active') {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + type;
        }

        // Message Bus Listener
        window.handleReviewUpdate = function(data) {
            // P2: 验证消息payload结构
            if (!data || typeof data !== 'object') {
                console.warn('Invalid message payload:', data);
                return;
            }
            console.log('Received review data:', data);
            if (data.status) {
                if (data.status === 'analyzing') showStatus('AI 正在分析原理图...', 'processing');
                if (data.status === 'complete') showStatus('分析完成', 'active');
                if (data.status === 'error') showStatus('分析失败: ' + (data.message || ''), 'active');
            }

            if (data.result) {
                // P2: 使用Array.isArray验证数组
                reviewData.must_fix = Array.isArray(data.result.must_fix) ? data.result.must_fix : [];
                reviewData.suggestions = Array.isArray(data.result.suggestions) ? data.result.suggestions : [];
                updateBadges();
                render();
            }
        };

        if (typeof eda !== 'undefined' && eda.sys_MessageBus && eda.sys_MessageBus.subscribePublic) {
            eda.sys_MessageBus.subscribePublic('ai-review/data', window.handleReviewUpdate);
            eda.sys_MessageBus.subscribePublic('ai-review/status', window.handleReviewUpdate);
        }

        // Utility
        function escapeHtml(text) {
            // P2: 防止非字符串输入导致.replace报错
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Init
        showStatus('Ready');
    </script>
</body>
</html>
