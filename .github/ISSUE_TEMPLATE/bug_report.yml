name: Bug Report
description: Report a bug
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly and concisely describe the bug
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can this issue be reproduced
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. Scroll to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: If applicable, paste debug logs here (click the ðŸ› button in the top-right corner of the AI Assistant panel)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your issue

  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What extension version are you using?
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: eda-version
    attributes:
      label: EasyEDA Pro Version
      description: What EasyEDA Pro version are you using?
      placeholder: 3.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other information about the issue here
