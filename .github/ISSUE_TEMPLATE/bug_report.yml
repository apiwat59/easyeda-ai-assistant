name: Bug Report
description: 报告一个 Bug
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 Bug 报告！

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述这个 Bug
      placeholder: 告诉我们发生了什么...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 如何重现这个问题
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 调试日志
      description: 如果适用，请粘贴调试日志（点击 AI 助手面板右上角 🐛 按钮）
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用，添加截图来帮助解释你的问题

  - type: input
    id: version
    attributes:
      label: 扩展版本
      description: 你使用的扩展版本是什么？
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: eda-version
    attributes:
      label: EasyEDA Pro 版本
      description: 你使用的 EasyEDA Pro 版本是什么？
      placeholder: 3.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 添加任何其他关于问题的信息
