name: Feature Request
description: Suggest a new feature
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a feature suggestion!

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem are you encountering? What problem would this feature solve?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What kind of solution would you like to see?
      placeholder: I would like to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or features have you considered?

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a specific use case
      placeholder: |
        As a circuit designer,
        I want to...
        so that I can...

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: If possible, provide examples or references

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other information about the feature request here
